[package]
name = "calcard-next-web"
description = "WASM bindings and demo site for calcard-next (iCalendar/JSCalendar and vCard/JSContact conversion)"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Default features are off to leave out `legacy-charsets` (encoding_rs) and
# keep the WebAssembly bundle small; `jmap` provides JSCalendar/JSContact.
calcard-next = { path = "..", default-features = false, features = ["jmap", "wasm"] }
wasm-bindgen = "0.2.130"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"
# Not a direct dependency: this enables the `wasm_js` backend of the
# getrandom used by `ahash`. It must track the major version `ahash` uses
# (0.3), not the latest getrandom.
getrandom = { version = "0.3.4", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
